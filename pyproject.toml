[project]
name = "evaluationframework"
version = "0.1.0"
description = "Six-bucket fidelity benchmark for synthetic financial return generators"
requires-python = ">=3.12"
dependencies = [
    "cython>=3.2.5",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "scipy>=1.17.1",
    "torch>=2.12.0",
]

[project.optional-dependencies]
dev = ["ipykernel>=7.2.0", "pytest>=8.0", "pandas-stubs~=3.0.3", "scipy-stubs~=1.17.1"]
data = ["alpaca-py>=0.13"]

[project.scripts]
bench = "bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation_framework", "data_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "ruff>=0.15.19",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
